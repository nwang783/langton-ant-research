name: One-time verified Langton research import

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: langton-one-time-snapshot-import
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'nwang783/langton-ant-research'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: nwang783/langton-ant-research
      RELEASE_TAG: research-snapshot-2026-10-24
      BUNDLE_NAME: langton-research-snapshot.bundle
      EXPECTED_BUNDLE_BYTES: '50095426'
      EXPECTED_BUNDLE_SHA256: '507d18dfa03ed273da90bc19728819d2b168ac610619c641099dd8cdc89e818a'
      EXPECTED_SNAPSHOT_COMMIT: 'dd3aa8e014f48228064b939456a691df15845c94'
      EXPECTED_SNAPSHOT_TREE: '6d222c7b48f0ea3d5c120330e1b430d6409b6e7a'
    steps:
      - name: Verify release asset and import its exact tree without force
        shell: bash
        run: |
          set -euo pipefail
          # No repository code, external actions, installers, PATs, or stored secrets are used.
          [[ "$EXPECTED_BUNDLE_BYTES" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_BUNDLE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_SNAPSHOT_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SNAPSHOT_TREE" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REPOSITORY" = "$GH_REPO"
          work=$(mktemp -d "$RUNNER_TEMP/langton-import.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          # Draft assets are resolved via release/asset IDs, never the published-release-by-tag route.
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > "$work/releases.json"
          jq --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag and .draft == true)]' \
            "$work/releases.json" > "$work/release_matches.json"
          jq -e 'length == 1' "$work/release_matches.json" > /dev/null
          release_id=$(jq -r '.[0].id' "$work/release_matches.json")
          [[ "$release_id" =~ ^[0-9]+$ ]]
          gh api --paginate --slurp "repos/$GH_REPO/releases/$release_id/assets?per_page=100" \
            > "$work/assets.json"
          jq --arg name "$BUNDLE_NAME" --argjson size "$EXPECTED_BUNDLE_BYTES" \
            '[.[][] | select(.name == $name and .state == "uploaded" and .size == $size)]' \
            "$work/assets.json" > "$work/asset_matches.json"
          jq -e 'length == 1' "$work/asset_matches.json" > /dev/null
          asset_id=$(jq -r '.[0].id' "$work/asset_matches.json")
          [[ "$asset_id" =~ ^[0-9]+$ ]]
          digest=$(jq -r '.[0].digest // empty' "$work/asset_matches.json")
          if test -n "$digest"; then test "$digest" = "sha256:$EXPECTED_BUNDLE_SHA256"; fi
          gh api -H 'Accept: application/octet-stream' \
            "repos/$GH_REPO/releases/assets/$asset_id" > "$work/$BUNDLE_NAME"
          test "$(wc -c < "$work/$BUNDLE_NAME")" = "$EXPECTED_BUNDLE_BYTES"
          printf '%s  %s\n' "$EXPECTED_BUNDLE_SHA256" "$work/$BUNDLE_NAME" | sha256sum --check --strict

          git init --quiet "$work/repository"
          cd "$work/repository"
          git config user.name 'Research Snapshot Import'
          git config user.email 'research-snapshot@localhost'
          git remote add origin "https://github.com/$GH_REPO.git"
          # The built-in token is consumed by gh's credential helper, never embedded in a URL.
          git -c credential.helper='!gh auth git-credential' fetch --no-tags origin \
            refs/heads/main:refs/remotes/origin/main
          parent=$(git rev-parse refs/remotes/origin/main)
          test "$parent" = "$GITHUB_SHA"

          git bundle verify "$work/$BUNDLE_NAME"
          git fetch --no-tags "$work/$BUNDLE_NAME" \
            refs/heads/main:refs/remotes/snapshot/main
          test "$(git rev-parse refs/remotes/snapshot/main)" = "$EXPECTED_SNAPSHOT_COMMIT"
          test "$(git rev-parse 'refs/remotes/snapshot/main^{tree}')" = "$EXPECTED_SNAPSHOT_TREE"
          test "$(git rev-list --count refs/remotes/snapshot/main)" = 1
          # The reviewed snapshot contains no import workflow. Its exact tree removes this workflow.
          test -z "$(git ls-tree -r --name-only refs/remotes/snapshot/main .github/workflows)"
          commit=$(printf '%s\n\n%s\n' \
            'Import verified Langton research snapshot' \
            'Canonical finite-seed highway conjecture remains UNSOLVED.' \
            | git commit-tree "$EXPECTED_SNAPSHOT_TREE" -p "$parent")
          test "$(git rev-parse "$commit^{tree}")" = "$EXPECTED_SNAPSHOT_TREE"
          observed=$(git -c credential.helper='!gh auth git-credential' \
            ls-remote origin refs/heads/main | cut -f1)
          test "$observed" = "$parent"
          # Never force, retry around a protection, create credentials, or expand permissions.
          git -c credential.helper='!gh auth git-credential' push origin "$commit:refs/heads/main"
          remote=$(git -c credential.helper='!gh auth git-credential' \
            ls-remote origin refs/heads/main | cut -f1)
          test "$remote" = "$commit"
          test "$(gh api "repos/$GH_REPO/git/commits/$commit" --jq '.tree.sha')" = "$EXPECTED_SNAPSHOT_TREE"
          printf 'Verified imported commit: %s\nVerified tree: %s\n' "$commit" "$EXPECTED_SNAPSHOT_TREE"
